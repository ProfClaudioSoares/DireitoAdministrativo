name: Deploy Functions

# Deploy SOMENTE das Edge Functions no projeto Supabase já existente (não cria
# nada). Descobre o ref pelo nome do projeto e usa o secret SUPABASE_ACCESS_TOKEN.
on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Nome do projeto Supabase"
        required: true
        default: "estudio-conteudo-cs"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions
        run: |
          set -euo pipefail
          REF="$(supabase projects list -o json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);const p=a.find(x=>x.name===process.argv[1]);process.stdout.write((p&&(p.id||p.ref))||"")}catch{process.exit(0)}})' "${{ inputs.project_name }}")"
          [ -n "$REF" ] || { echo "Projeto '${{ inputs.project_name }}' não encontrado."; exit 1; }
          echo "REF=$REF"
          echo "URL=https://$REF.supabase.co"
          supabase functions deploy \
            generate-carousel render-slides compliance-review publish-due-posts mixpost-schedule \
            --project-ref "$REF"
          echo "✔ Functions deployadas em https://$REF.supabase.co"
