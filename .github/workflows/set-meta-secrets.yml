name: Set Meta Secrets

# Grava os secrets da publicação (Instagram Login) nas Edge Functions do projeto Supabase já
# existente. Lê os valores de SECRETS DO REPOSITÓRIO (mascarados — nunca vazam no
# log). Disparo MANUAL (Actions → Set Meta Secrets → Run).
#
# Pré-requisitos (repo → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   (já existe)
#   META_IG_USER_ID         user_id do Instagram profissional (via graph.instagram.com/me?fields=user_id)
#   META_APP_ID             App ID do app da Meta
#   META_APP_SECRET         App Secret do app da Meta
#   META_LONG_LIVED_TOKEN   token de longa duração (~60 dias)
on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Nome do projeto Supabase"
        required: true
        default: "estudio-conteudo-cs"

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      META_LONG_LIVED_TOKEN: ${{ secrets.META_LONG_LIVED_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Conferir que os secrets existem
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$IG_USER_ID" ] || missing="$missing META_IG_USER_ID"
          [ -n "$META_APP_ID" ] || missing="$missing META_APP_ID"
          [ -n "$META_APP_SECRET" ] || missing="$missing META_APP_SECRET"
          [ -n "$META_LONG_LIVED_TOKEN" ] || missing="$missing META_LONG_LIVED_TOKEN"
          if [ -n "$missing" ]; then
            echo "Faltam secrets do repositório:$missing"
            echo "Adicione em Settings → Secrets and variables → Actions e rode de novo."
            exit 1
          fi

      - name: Gravar secrets no projeto Supabase
        run: |
          set -euo pipefail
          REF="$(supabase projects list -o json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);const p=a.find(x=>x.name===process.argv[1]);process.stdout.write((p&&(p.id||p.ref))||"")}catch{process.exit(0)}})' "${{ inputs.project_name }}")"
          [ -n "$REF" ] || { echo "Projeto '${{ inputs.project_name }}' não encontrado."; exit 1; }
          echo "REF=$REF"

          supabase secrets set \
            IG_USER_ID="$IG_USER_ID" \
            META_APP_ID="$META_APP_ID" \
            META_APP_SECRET="$META_APP_SECRET" \
            META_LONG_LIVED_TOKEN="$META_LONG_LIVED_TOKEN" \
            --project-ref "$REF"

          echo "✔ Secrets da Meta gravados. Confira (só nomes, sem valores):"
          supabase secrets list --project-ref "$REF"
