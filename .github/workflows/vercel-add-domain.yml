name: Vercel Add Domain

# Adiciona um domínio a um projeto do Vercel via API (a rede desta sessão não
# alcança api.vercel.com; os runners do GitHub, sim). O token é passado como
# input e mascarado no log. Disparo MANUAL.
on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domínio/subdomínio a adicionar"
        required: true
        default: "estudio.claudiosoares.adv.br"

# Requer o secret de repositório VERCEL_TOKEN
# (Settings -> Secrets and variables -> Actions -> New repository secret).
jobs:
  add-domain:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DOMAIN: ${{ inputs.domain }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Conferir token
        run: '[ -n "$VERCEL_TOKEN" ] || { echo "Falta o secret VERCEL_TOKEN no repositório."; exit 1; }'
      - name: Adicionar domínio no Vercel
        run: node scripts/vercel-add-domain.mjs
