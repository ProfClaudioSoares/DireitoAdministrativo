name: Deploy

# Push na main → produção. Duas responsabilidades:
#   • Edge Functions do Supabase: deployadas AQUI, usando só o
#     SUPABASE_ACCESS_TOKEN (descobre o ref pelo nome do projeto — sem senha do
#     banco, que não fica no CI).
#   • Front-end: publicado pela INTEGRAÇÃO NATIVA do Vercel com o GitHub (o
#     projeto está conectado ao repo, branch de produção = main). Por isso NÃO
#     há job de Vercel aqui — ele seria um deploy duplicado.
#
# Observação: migrações de schema (supabase db push) exigem a senha do banco e
# não rodam no CI; são raras e aplicadas à parte quando necessário.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Qualidade: sempre roda (PR e push) ──────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # ── Edge Functions do Supabase: só na main, com o access token ──────────────
  functions:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_NAME: estudio-conteudo-cs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Edge Functions
        run: |
          set -euo pipefail
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "Falta o secret SUPABASE_ACCESS_TOKEN."; exit 1; }
          REF="$(supabase projects list -o json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);const p=a.find(x=>x.name===process.argv[1]);process.stdout.write((p&&(p.id||p.ref))||"")}catch{process.exit(0)}})' "$PROJECT_NAME")"
          [ -n "$REF" ] || { echo "Projeto '$PROJECT_NAME' não encontrado."; exit 1; }
          echo "REF=$REF"
          supabase functions deploy \
            generate-carousel render-slides compliance-review publish-due-posts mixpost-schedule \
            --project-ref "$REF"
          echo "✔ Edge Functions deployadas."
