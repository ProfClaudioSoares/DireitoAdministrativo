name: Set Vault Secrets

# Cria os segredos do Vault usados pelo cron de publicação (§2/§10):
# service_role_key e functions_base_url. Sem eles, o cron dispara mas não
# consegue chamar a Edge Function `publish-due-posts` — e os posts ficam
# eternamente "scheduled".
#
# Usa APENAS o token pessoal já guardado no repo (SUPABASE_ACCESS_TOKEN):
# descobre o ref, busca a service_role key e cria os segredos via a API de
# gerenciamento do Supabase. Idempotente. Disparo MANUAL.
on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Nome do projeto Supabase"
        required: true
        default: "estudio-conteudo-cs"

jobs:
  set-vault:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Conferir token
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "Falta o secret SUPABASE_ACCESS_TOKEN."; exit 1; }

      - name: Descobrir ref, buscar service_role e criar segredos do Vault
        run: |
          set -euo pipefail
          REF="$(supabase projects list -o json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);const p=a.find(x=>x.name===process.argv[1]);process.stdout.write((p&&(p.id||p.ref))||"")}catch{process.exit(0)}})' "${{ inputs.project_name }}")"
          [ -n "$REF" ] || { echo "Projeto '${{ inputs.project_name }}' não encontrado."; exit 1; }
          echo "REF=$REF"

          SRK="$(supabase projects api-keys --project-ref "$REF" -o json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);const k=a.find(x=>x.name==="service_role");process.stdout.write((k&&(k.api_key||k.apiKey))||"")}catch{process.exit(0)}})')"
          [ -n "$SRK" ] || { echo "Não consegui obter a service_role key."; exit 1; }
          echo "::add-mask::$SRK"

          SUPABASE_PROJECT_REF="$REF" SERVICE_ROLE_KEY="$SRK" node scripts/set-vault-secrets.mjs
